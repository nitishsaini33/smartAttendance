[build]
dockerfilePath = "student-attendance-system/server/python/Dockerfile"
buildContext = "student-attendance-system/server/python"

[deploy]
startCommand = "gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 1 api_server:app"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
